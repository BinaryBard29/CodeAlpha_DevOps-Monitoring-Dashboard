plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    mavenCentral()
}

dependencies {

    implementation 'com.github.oshi:oshi-core:6.6.5'

}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
    }
}

javafx {

    version = '21'

    modules = [
            'javafx.controls',
            'javafx.fxml',
            'javafx.graphics'
    ]
}

application {

    mainClass = 'com.dashboard.App'
}